on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

name: CI

concurrency:
  # Cancel superseded in-progress/queued runs for the same ref (PRs only).
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # Applies to every cargo invocation, so build/test/clippy share one cache.
  RUSTFLAGS: "-D warnings"

jobs:
  host:
    name: Host tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Install nightly toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt

      - name: Cache build
        uses: Swatinem/rust-cache@v2

      - name: Format, lint, build, test
        run: bash .github/ci/host.sh

  firmware:
    name: Firmware ${{ matrix.name }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: h563zi
            dir: examples/embassy-nucleo-h563zi
          - name: g474re-sink
            dir: examples/embassy-nucleo-g474re-sink
          - name: g474re-sink-epr
            dir: examples/embassy-nucleo-g474re-sink-epr
          - name: g474re-source
            dir: examples/embassy-nucleo-g474re-source
          # The DRP example builds two role feature variants from the same
          # crate. One matrix job per variant; the binaries are copied aside
          # under distinct names (the feature flag only const-evaluates
          # cfg!(feature = "role-initiator"), but the binaries differ).
          - name: g474re-drp-initiator
            dir: examples/embassy-nucleo-g474re-drp
            features: role-initiator
            source-binary: usbpd-g474re-drp
            artifact-binary: usbpd-g474re-drp-initiator
            artifact-name: drp-initiator-firmware
          - name: g474re-drp-acceptor
            dir: examples/embassy-nucleo-g474re-drp
            features: role-acceptor
            source-binary: usbpd-g474re-drp
            artifact-binary: usbpd-g474re-drp-acceptor
            artifact-name: drp-acceptor-firmware

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv7em-none-eabihf,thumbv8m.main-none-eabihf
          components: clippy

      - name: Install nightly toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt

      - name: Cache build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ matrix.dir }}
          key: ${{ matrix.name }}

      - name: Format, lint, build
        run: bash .github/ci/firmware.sh ${{ matrix.dir }} '${{ matrix.features }}' ${{ matrix.source-binary }} ${{ matrix.artifact-binary }}

      - name: Upload firmware artifact
        if: matrix.artifact-name != ''
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: ${{ matrix.dir }}/target/thumbv7em-none-eabihf/release/${{ matrix.artifact-binary }}
          if-no-files-found: error

  # One rig job at a time: queue, don't cancel. Same-repo runs are ungated.
  hardware_test:
    name: Hardware test
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    needs: [firmware]
    runs-on: self-hosted
    timeout-minutes: 15
    concurrency:
      group: hardware-probes
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download initiator firmware
        uses: actions/download-artifact@v4
        with:
          name: drp-initiator-firmware

      - name: Download acceptor firmware
        uses: actions/download-artifact@v4
        with:
          name: drp-acceptor-firmware

      - name: Role-swap test
        run: bash .github/ci/hardware_test.sh

  # Fork PR approval-gated via the `hardware-rig` environment.
  hardware_test_fork:
    name: Hardware test (fork)
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name != github.repository
    needs: [firmware]
    runs-on: self-hosted
    timeout-minutes: 15
    environment: hardware-rig
    concurrency:
      group: hardware-probes
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download initiator firmware
        uses: actions/download-artifact@v4
        with:
          name: drp-initiator-firmware

      - name: Download acceptor firmware
        uses: actions/download-artifact@v4
        with:
          name: drp-acceptor-firmware

      - name: Role-swap test
        run: bash .github/ci/hardware_test.sh

  # One job per compatibility tool; the crate/feature combinations are steps.
  msrv:
    name: Minimum Supported Rust Version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7

      - name: Install cargo-hack
        uses: taiki-e/install-action@cargo-hack

      - name: Cache build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            usbpd
            usbpd-traits
          key: msrv

      - name: Check MSRV (usbpd, serde,log)
        run: cargo hack check --rust-version -p usbpd --features serde,log

      - name: Check MSRV (usbpd, serde,defmt)
        run: cargo hack check --rust-version -p usbpd --features serde,defmt

      - name: Check MSRV (usbpd-traits, defmt)
        run: cargo hack check --rust-version -p usbpd-traits --features defmt

  semver:
    name: Semantic Versioning
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7

      - name: Check semver (usbpd, serde,log)
        uses: obi1kenobi/cargo-semver-checks-action@v2
        with:
          manifest-path: usbpd/Cargo.toml
          feature-group: default-features
          features: serde,log

      - name: Check semver (usbpd, serde,defmt)
        uses: obi1kenobi/cargo-semver-checks-action@v2
        with:
          manifest-path: usbpd/Cargo.toml
          feature-group: default-features
          features: serde,defmt

      - name: Check semver (usbpd-traits, defmt)
        uses: obi1kenobi/cargo-semver-checks-action@v2
        with:
          manifest-path: usbpd-traits/Cargo.toml
          feature-group: default-features
          features: defmt

  min-versions:
    name: Minimal Direct Dependency Versions
    runs-on: ubuntu-latest
    env:
      # `-Zminimal-versions` is nightly-only cargo; pin it explicitly so the
      # pinned channel in rust-toolchain.toml cannot flip this job to stable.
      RUSTUP_TOOLCHAIN: nightly
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7

      - name: Install nightly toolchain
        uses: dtolnay/rust-toolchain@nightly

      - name: Install dependency checking tools
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-hack,cargo-minimal-versions

      - name: Cache build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            usbpd
            usbpd-traits
          key: min-versions

      - name: Check minimum dependency versions (usbpd, serde,log)
        run: cargo minimal-versions check -p usbpd --features serde,log

      - name: Check minimum dependency versions (usbpd, serde,defmt)
        run: cargo minimal-versions check -p usbpd --features serde,defmt

      - name: Check minimum dependency versions (usbpd-traits, defmt)
        run: cargo minimal-versions check -p usbpd-traits --features defmt

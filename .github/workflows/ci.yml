on:
  pull_request:
  workflow_dispatch:

name: CI

env:
  CARGO_TERM_COLOR: always

jobs:
  build_and_test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: true

      - run: rustup toolchain install nightly -c rustfmt

      - name: Cache build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            usbpd
            examples/embassy-nucleo-h563zi
            examples/embassy-nucleo-g474re-sink
            examples/embassy-nucleo-g474re-sink-epr
            examples/embassy-nucleo-g474re-source

      - name: Build
        run: bash .github/ci/build.sh

      - name: Test
        run: bash .github/ci/test.sh

      - name: Upload sink firmware
        uses: actions/upload-artifact@v4
        with:
          name: sink-firmware
          path: examples/embassy-nucleo-g474re-sink/target/thumbv7em-none-eabihf/release/usbpd-g474re-sink

      - name: Upload source firmware
        uses: actions/upload-artifact@v4
        with:
          name: source-firmware
          path: examples/embassy-nucleo-g474re-source/target/thumbv7em-none-eabihf/release/usbpd-g474re-source

  msrv:
    name: Minimum Supported Rust Version
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - crate: usbpd
            features: serde,log
          - crate: usbpd
            features: serde,defmt
          - crate: usbpd-traits
            features: defmt
    env:
      RUSTFLAGS: "-D warnings"
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7

      - name: Install cargo-hack
        uses: taiki-e/install-action@cargo-hack

      - name: Check MSRV
        run: cargo hack check --rust-version -p ${{ matrix.crate }} --features ${{ matrix.features }}

  semver:
    name: Semantic Versioning
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - crate: usbpd
            features: serde,log
          - crate: usbpd
            features: serde,defmt
          - crate: usbpd-traits
            features: defmt
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7

      - name: Check semver
        uses: obi1kenobi/cargo-semver-checks-action@v2
        with:
          manifest-path: ${{ matrix.crate }}/Cargo.toml
          feature-group: default-features
          features: ${{ matrix.features }}

  min-versions:
    name: Minimal Direct Dependency Versions
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - crate: usbpd
            features: serde,log
          - crate: usbpd
            features: serde,defmt
          - crate: usbpd-traits
            features: defmt
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7

      - name: Install nightly toolchain
        uses: dtolnay/rust-toolchain@nightly

      - name: Install dependency checking tools
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-hack,cargo-minimal-versions

      - name: Check minimum dependency versions
        run: cargo minimal-versions check -p ${{ matrix.crate }} --features ${{ matrix.features }}

  hardware_test:
    needs: build_and_test
    runs-on: self-hosted

    steps:
      - name: Download sink firmware
        uses: actions/download-artifact@v4
        with:
          name: sink-firmware

      - name: Download source firmware
        uses: actions/download-artifact@v4
        with:
          name: source-firmware

      - name: Verify probes connected
        run: probe-rs list

      - name: Hardware test
        env:
          PROBE_SERIAL_A: ${{ secrets.PROBE_SERIAL_A }}
          PROBE_SERIAL_B: ${{ secrets.PROBE_SERIAL_B }}
        run: bash .github/ci/hardware_test.sh

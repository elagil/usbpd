# Hardware test on the physical rig, triggered by completed CI runs.
#
# `workflow_run` always reads this file from the default branch and executes on
# the base repository: PR code is never executed (trusted checkout, firmware
# from the triggering run's artifacts). Fork PRs are gated by the `hardware-rig`
# environment (required reviewer); same-repo runs (PRs, main pushes, manual CI
# dispatches) run ungated.
name: Hardware test

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  # Downloading artifacts from the triggering run requires Actions read.
  actions: read

concurrency:
  # The physical rig (two boards, two probes) only allows one test at a time:
  # strictly queue runs, never cancel an in-progress rig run.
  group: hardware-probes
  cancel-in-progress: false

jobs:
  hardware_test:
    name: Hardware test (same repo)
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      (github.event.workflow_run.event == 'push' ||
       github.event.workflow_run.event == 'workflow_dispatch' ||
       (github.event.workflow_run.event == 'pull_request' &&
        github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: self-hosted
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Test
        uses: ./.github/actions/drp-hardware-test
        with:
          ci-run-id: ${{ github.event.workflow_run.id }}

  hardware_test_fork:
    name: Hardware test (fork PR)
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name != github.repository
    runs-on: self-hosted
    timeout-minutes: 15
    environment: hardware-rig

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Test
        uses: ./.github/actions/drp-hardware-test
        with:
          ci-run-id: ${{ github.event.workflow_run.id }}
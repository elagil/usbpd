name: DRP hardware test

description: Execute the role-swap test on hardwre.

inputs:
  ci-run-id:
    description: CI run ID that built the drp-initiator/drp-acceptor firmware artifacts
    required: true

runs:
  using: composite
  steps:
    - name: Download initiator firmware
      uses: actions/download-artifact@v4
      with:
        name: drp-initiator-firmware
        run-id: ${{ inputs.ci-run-id }}
        github-token: ${{ github.token }}

    - name: Download acceptor firmware
      uses: actions/download-artifact@v4
      with:
        name: drp-acceptor-firmware
        run-id: ${{ inputs.ci-run-id }}
        github-token: ${{ github.token }}

    - name: Verify probes connected
      run: probe-rs list
      shell: bash

    - name: Role-swap test
      run: bash .github/ci/hardware_test.sh
      shell: bash
